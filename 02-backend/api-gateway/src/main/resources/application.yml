server:
  port: 8443
  ssl:
    enabled: true
    key-alias: rong
    key-store: "${GATEWAY_KEYSTORE_PATH:file:${user.dir}/../full-stack-eCommerce/full-stack-eCommerce/src/main/resources/rong-keystore.p12}"
    key-store-password: ${KEYSTORE_PASSWORD:secret}
    key-store-type: PKCS12

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        ssl:
          use-insecure-trust-manager: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_UNIQUE
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - https://localhost:4200
              - http://localhost:4200
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: '*'
      routes:
        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/products/**,/api/product-category/**
        - id: monolith-service
          uri: ${MONOLITH_SERVICE_URL:https://localhost:8445}
          predicates:
            - Path=/api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
